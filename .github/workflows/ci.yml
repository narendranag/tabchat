name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Pinned: Xcode 27 is only a preview image on GitHub's runners (2026-10).
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - name: Install build tools
        run: |
          brew install xcodegen swiftlint swiftformat just
      - name: Lint
        run: just lint
      - name: Test
        run: just test
      - name: Build
        run: just build
